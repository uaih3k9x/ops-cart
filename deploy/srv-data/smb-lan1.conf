# /etc/systemd/system/smb.service.d/ops-cart-lan1.conf (#95): smb.conf 只绑 LAN1 (bind interfaces only).
# LAN1 没插线 = NetworkManager 不给 eno1 上地址, smbd 起来找不到能绑的接口就 smb_panic, 留 core 和 failed 单元.
# 这里没地址就跳过 (ExecCondition 返回 1 = 单元算没跑, 不算失败); 插线来地址时 NM 钩子 50-ops-cart-smb 再拉起.
# 只给 Samba 手工配置的推车装 (docs/MIGRATE_95.md); setup-samba.sh 生成的 smb.conf 带 lo, 不会崩, 不装这份.
# 只看 eno1 有没有 IPv4, 不看是不是 smb.conf 里写的那个地址: 手工配置要同时把 interfaces 改成带 lo 才算兜住.
[Service]
ExecCondition=/bin/sh -c 'ip -4 -o addr show dev eno1 | grep -q " inet "'
