# /srv/data 目录布局 (#11). 不放 /etc/tmpfiles.d: 开机那一轮可能早于数据盘挂上, 会建到根分区上.
# 由 srv-data-layout.service 在数据盘挂上之后跑 (装到 /etc/ops-cart/srv-data.tmpfiles.conf).
# ops-smb 组由 setup-srv-data.sh 先建好; 可写的 Samba 账号进这个组.
d /srv/data/iso       0755 root root    -
d /srv/data/win       0755 root root    -
d /srv/data/tools     0755 root root    -
d /srv/data/drivers   2775 root ops-smb -
# 单位的数据 (含单位机器内容): 交接/离开时 /srv/data/org 整块拷走或清掉
d /srv/data/org       0755 root root    -
d /srv/data/org/clone 2775 root ops-smb -
