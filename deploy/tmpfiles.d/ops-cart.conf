# 机器日志目录; 报告留 90 天 (logrotate 管不了目录里的零散文件). wheel 组可读, 排障不用 sudo
d /var/log/ops-cart         0750 root wheel -
d /var/log/ops-cart/reports 0750 root wheel 90d
# 运行时状态: pxe-guard.json (装机口守卫) / pxe-renew.json (车机请求续期自己发地址) / pin-gate.json (PIN 输错计数) / mpv.sock /
# serial-write.json (串口写租约、挂起、急停, #21); 重启推车清空
d /run/ops-cart             0755 root root -
# 网页口投串口急停 / 拒绝请求的目录 (#23): 只有 ops-web 能写, cart-serial-req.path 盯着. 没建 ops-web 用户时这行报错跳过
d /run/ops-cart/serial-req 0700 ops-web ops-web -
