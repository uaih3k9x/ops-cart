# 默认菜单模板: 超时后从本地盘启动 (exit 退回固件按启动顺序走), 救援只能手选. 地址是示例, 按实际装机网段改.
# 救援是 root 带 sshd, 可能无需密码; 自动装机菜单只应按 MAC 单独下发 (grub.cfg-01-<mac>), 不要放进默认菜单.
set default=0
set timeout=10

menuentry 'Boot from local disk' {
    exit
}

menuentry 'Rescue shell (HTTP fast)' {
    linux (http,192.0.2.1)/vmlinuz ip=dhcp inst.stage2=http://192.0.2.1:8000/rocky inst.rescue inst.sshd inst.text
    initrd (http,192.0.2.1)/initrd.img
}

menuentry 'Rescue shell (TFTP slow)' {
    linux /vmlinuz ip=dhcp inst.stage2=http://192.0.2.1:8000/rocky inst.rescue inst.sshd inst.text
    initrd /initrd.img
}
